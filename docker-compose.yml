version: "3.8"

services:
  layoutlingua:
    build:
      context: .
      dockerfile: Dockerfile
    image: layoutlingua:latest
    container_name: layoutlingua-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - LAYOUTLINGUA_ONNX_MODEL=/app/models/doclayout_yolo.onnx
    volumes:
      # Optional mounted directory for ONNX vision models
      - ./models:/app/models:ro
      # Translation cache and settings persistence
      - layoutlingua-data:/root/.cache/layoutlingua

volumes:
  layoutlingua-data:
    name: layoutlingua_cache

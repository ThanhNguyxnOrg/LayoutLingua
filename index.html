    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var origDefineProperty = Object.defineProperty;

          // Ensure any future Object.defineProperty(window, 'fetch', desc) includes a setter
          Object.defineProperty = function ( target, prop, descriptor ) {
            if (
              (target === window || target === globalThis) &&
              prop === 'fetch' &&
              descriptor &&
              typeof descriptor.get === 'function' &&
              typeof descriptor.set !== 'function'
            ) {
              var getter = descriptor.get;
              var customFetch = null;
              return origDefineProperty.call(Object, target, prop, {
                configurable: true,
                enumerable: descriptor.enumerable !== false,
                get: function () {
                  return customFetch || getter.call(this);
                },
                set: function (val) {
                  if (typeof val === 'function') {
                    customFetch = val;
                  }
                }
              });
            }
            return origDefineProperty.call(Object, target, prop, descriptor);
          };

          // If window.fetch is already a getter-only property, upgrade it to have a setter
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (!desc || desc.configurable !== false) {
            origDefineProperty.call(Object, window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                if (typeof val === 'function') {
                  currentFetch = val;
                }
              }
            });
          }
        } catch (_e) {}

        // Prevent third-party browser extensions (e.g. chrome-extension://) from crashing the app
        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              file.indexOf('chrome-extension://') !== -1 ||
              file.indexOf('moz-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var stack = String((reason && reason.stack) || '');
            var msg = String((reason && reason.message) || reason || '');
            if (
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('moz-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {

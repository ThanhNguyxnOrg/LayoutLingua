name: Release 3 Desktop Platforms

# CI Cost & Resource Protection:
# Heavy cross-platform runners (Windows, macOS, Linux) will ONLY run when:
# 1. The central control plane creates a vX.Y.Z tag, e.g.:
#      git commit -m "release: 2.0.0"
#      git commit -m "release(core): 2.0.0"
#      git commit -m "[release] 2.0.0"
#      git commit -m "chore(release): 2.0.0"
#      git commit -m "bump: 2.0.0"
# 2. This workflow builds the desktop artifacts and uploads them to the central draft release.
#
# Normal pushes never start platform release builds.

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild after a failed release (no tag is created).
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check-and-tag:
    name: Detect Release, Resolve Version & Tag
    runs-on: ubuntu-latest
    # Resource Guard: Skip in 0 seconds if normal commit without release keyword
    if: (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) || github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: agent-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout the selected release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          token: ${{ steps.agent-token.outputs.token }}
          fetch-depth: 0

      - name: Parse release trigger & resolve semantic version
        id: check
        shell: python
        run: |
          import os
          import re
          import subprocess

          event_name = os.environ.get("EVENT_NAME", "")
          ref_name = os.environ.get("REF_NAME", "")
          input_tag = os.environ.get("INPUT_TAG", "").strip()

          tag = ""
          if event_name == "workflow_dispatch":
              tag = input_tag
          elif event_name == "create" and ref_name.startswith("v"):
              tag = ref_name

          should_release = False
          version = ""
          if tag:
              if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?", tag):
                  raise SystemExit(f"Invalid release tag: {tag}")
              exact = subprocess.run(
                  ["git", "describe", "--tags", "--exact-match", "HEAD"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if exact.returncode != 0 or exact.stdout.strip() != tag:
                  raise SystemExit(f"Checkout is not the exact requested tag: {tag}")
              version = tag[1:]
              should_release = True
          else:
              print("No vX.Y.Z create event or explicit recovery tag; skipping release build.")

          print(f"Result: should_release={should_release}, version={version}, tag={tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_release={str(should_release).lower()}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}


  windows:
    name: Windows (x86_64)
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-and-tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build Standalone Windows Desktop App (.exe)
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            npm ci --legacy-peer-deps
            npm run build
          }
          python -m layoutlingua.desktop --build-exe --onefile --output-name LayoutLingua-windows-x86_64
          New-Item -ItemType Directory -Force -Path "dist/release" | Out-Null
          Copy-Item -Force "release/LayoutLingua-windows-x86_64.exe" "dist/release/LayoutLingua-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-layoutlingua-windows-x86_64
          path: dist/release/LayoutLingua-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            python_arch: arm64
          - arch: intel
            python_arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-and-tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build and Package macOS DMG (${{ matrix.arch }})
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            npm ci --legacy-peer-deps
            npm run build
          fi
          python -m layoutlingua.desktop --build-exe
          mkdir -p dist/release
          mkdir -p dmg_stage

          if [ -d "release/LayoutLingua.app" ]; then
            cp -r release/LayoutLingua.app dmg_stage/
          fi
          cp public/icon.icns dmg_stage/.VolumeIcon.icns 2>/dev/null || true
          SetFile -c icnC dmg_stage/.VolumeIcon.icns 2>/dev/null || true
          SetFile -a C dmg_stage 2>/dev/null || true
          ln -s /Applications dmg_stage/Applications

          hdiutil create -volname "LayoutLingua" -srcfolder dmg_stage -ov -format UDZO "dist/release/LayoutLingua-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-layoutlingua-macos-${{ matrix.arch }}
          path: dist/release/LayoutLingua-macos-*.dmg
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-and-tag.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev libcairo2-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build Standalone Linux Desktop Application (.AppImage)
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            npm ci --legacy-peer-deps
            npm run build
          fi

          # 1. Build PyInstaller bundle in onedir mode for fast AppImage execution
          python -m layoutlingua.desktop --build-exe --output-name LayoutLingua

          # 2. Assemble AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r release/LayoutLingua/* AppDir/usr/bin/
          cp LayoutLingua.desktop AppDir/usr/share/applications/
          cp LayoutLingua.desktop AppDir/
          cp public/logo.png AppDir/usr/share/icons/hicolor/512x512/apps/layoutlingua.png
          cp public/logo.png AppDir/layoutlingua.png
          cp public/logo.png AppDir/.DirIcon

          cp AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # 3. Download official appimagetool and build standalone .AppImage
          mkdir -p dist/release
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/release/LayoutLingua-linux-x86_64.AppImage
          chmod +x dist/release/LayoutLingua-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-layoutlingua-linux-x86_64
          path: dist/release/LayoutLingua-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish release assets through the organization library
    needs: [check-and-tag, windows, macos, linux]
    if: needs.check-and-tag.outputs.should_release == 'true'
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@0cbda3691e1ec9695d3ede536e0b34ff1713f5f0
    with:
      tag: ${{ needs.check-and-tag.outputs.tag }}
      artifact_pattern: release-assets-layoutlingua-*
      artifact_directory: dist/release
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

name: Release 3 Desktop Platforms

# CI Cost & Resource Protection:
# Heavy cross-platform runners (Windows, macOS, Linux) will ONLY run when:
# 1. A commit message on 'main' contains a release keyword, e.g.:
#      git commit -m "release: 2.0.0"
#      git commit -m "release(core): 2.0.0"
#      git commit -m "[release] 2.0.0"
#      git commit -m "chore(release): 2.0.0"
#      git commit -m "bump: 2.0.0"
# 2. A git tag is pushed (e.g. v2.0.0)
# 3. Manually triggered via workflow_dispatch
#
# Normal push commits (features, UI development, fixes, docs) skip immediately in 0 seconds.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0). Leave empty to use __version__ in layoutlingua/_version.py"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-and-tag:
    name: Detect Release, Resolve Version & Tag
    runs-on: ubuntu-latest
    # Resource Guard: Skip in 0 seconds if normal commit without release keyword
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'push' &&
        github.actor != 'dependabot[bot]' &&
        (
          startsWith(github.event.head_commit.message, 'release:') ||
          startsWith(github.event.head_commit.message, 'release(') ||
          startsWith(github.event.head_commit.message, '[release]') ||
          startsWith(github.event.head_commit.message, 'chore(release):') ||
          startsWith(github.event.head_commit.message, 'bump:')
        )
      )
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 🤖 Generate GitHub App Token via ThanhNguyxnAgent
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Parse release trigger & resolve semantic version
        id: check
        shell: python
        run: |
          import os
          import re

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          commit_msg = os.environ.get("COMMIT_MESSAGE", "")
          manual_version = os.environ.get("INPUT_VERSION", "").strip()

          version = None
          should_release = False

          # 1. Manual trigger (workflow_dispatch)
          if event_name == "workflow_dispatch":
              should_release = True
              if manual_version:
                  version = manual_version.lstrip("vV")
              else:
                  with open("layoutlingua/_version.py", "r", encoding="utf-8") as f:
                      m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', f.read())
                      if m:
                          version = m.group(1)

          # 2. Direct Tag push (e.g. refs/tags/v2.0.0)
          elif ref.startswith("refs/tags/v"):
              should_release = True
              version = ref_name.lstrip("vV")

          # 3. Push to main: check commit message keywords
          elif event_name == "push":
              rx = re.compile(r'(?i)^\s*(?:\[release\]\s*|release(?:\([^)]*\))?:\s*|chore\(release\):\s*|bump:\s*)(?:v)?(\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?)\b')
              m = rx.search(commit_msg.strip())
              if m:
                  should_release = True
                  version = m.group(1)
              else:
                  print("No release command keyword detected. Skipping release build.")

          tag = f"v{version}" if version else ""
          print(f"Result: should_release={should_release}, version={version}, tag={tag}")

          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as out:
                  out.write(f"should_release={str(should_release).lower()}\n")
                  out.write(f"version={version or ''}\n")
                  out.write(f"tag={tag}\n")
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: 🏷️ Auto-create and Push Tag via ThanhNguyxnAgent
        if: steps.check.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.check.outputs.tag }}
        run: |
          git config --global user.name "ThanhNguyxnAgent[bot]"
          git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          if ! git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "Creating tag $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists on remote. Proceeding to release update..."
          fi

  windows:
    name: Windows (x86_64)
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build Standalone Windows Desktop App (.exe)
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            npm ci --legacy-peer-deps
            npm run build
          }
          python -m layoutlingua.desktop --build-exe --onefile --output-name LayoutLingua-windows-x86_64
          New-Item -ItemType Directory -Force -Path "dist-release" | Out-Null
          Copy-Item -Force "release/LayoutLingua-windows-x86_64.exe" "dist-release/LayoutLingua-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: LayoutLingua-windows-x86_64
          path: dist-release/LayoutLingua-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            python_arch: arm64
          - arch: intel
            python_arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build and Package macOS DMG (${{ matrix.arch }})
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            npm ci --legacy-peer-deps
            npm run build
          fi
          python -m layoutlingua.desktop --build-exe
          mkdir -p dist-release
          mkdir -p dmg_stage

          if [ -d "release/LayoutLingua.app" ]; then
            cp -r release/LayoutLingua.app dmg_stage/
          fi
          cp public/icon.icns dmg_stage/.VolumeIcon.icns 2>/dev/null || true
          SetFile -c icnC dmg_stage/.VolumeIcon.icns 2>/dev/null || true
          SetFile -a C dmg_stage 2>/dev/null || true
          ln -s /Applications dmg_stage/Applications

          hdiutil create -volname "LayoutLingua" -srcfolder dmg_stage -ov -format UDZO "dist-release/LayoutLingua-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: LayoutLingua-macos-${{ matrix.arch }}
          path: dist-release/LayoutLingua-macos-*.dmg
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev libcairo2-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build Standalone Linux Desktop Application (.AppImage)
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            npm ci --legacy-peer-deps
            npm run build
          fi

          # 1. Build PyInstaller bundle in onedir mode for fast AppImage execution
          python -m layoutlingua.desktop --build-exe --output-name LayoutLingua

          # 2. Assemble AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r release/LayoutLingua/* AppDir/usr/bin/
          cp LayoutLingua.desktop AppDir/usr/share/applications/
          cp LayoutLingua.desktop AppDir/
          cp public/logo.png AppDir/usr/share/icons/hicolor/512x512/apps/layoutlingua.png
          cp public/logo.png AppDir/layoutlingua.png
          cp public/logo.png AppDir/.DirIcon

          cp AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # 3. Download official appimagetool and build standalone .AppImage
          mkdir -p dist-release
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist-release/LayoutLingua-linux-x86_64.AppImage
          chmod +x dist-release/LayoutLingua-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: LayoutLingua-linux-x86_64.AppImage
          path: dist-release/LayoutLingua-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish Release (All Desktop OS)
    needs: [check-and-tag, windows, macos, linux]
    if: needs.check-and-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Generate GitHub App Token via ThanhNguyxnAgent
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract changelog for release description
        shell: python
        run: |
          import re
          from pathlib import Path

          version = "${{ needs.check-and-tag.outputs.version }}"
          body = ""
          for p in [Path("docs/CHANGELOG.md"), Path("CHANGELOG.md")]:
              if p.is_file():
                  content = p.read_text(encoding="utf-8")
                  match = re.search(rf'##\s*\[?v?{re.escape(version)}\]?.*?\n(.*?)(?=\n##\s*\[|\Z)', content, re.DOTALL)
                  if match:
                      body = match.group(1).strip()
                      break

          Path("release-notes.md").write_text(body, encoding="utf-8")
          print(f"Extracted {len(body)} chars for version {version}")

      - name: Publish to GitHub Releases via ThanhNguyxnAgent
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-and-tag.outputs.tag }}
          name: LayoutLingua ${{ needs.check-and-tag.outputs.tag }}
          body_path: release-notes.md
          files: release-artifacts/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(needs.check-and-tag.outputs.tag, 'alpha') || contains(needs.check-and-tag.outputs.tag, 'beta') || contains(needs.check-and-tag.outputs.tag, 'rc') }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Sync version back to layoutlingua/_version.py and package.json if needed
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import re
          ver = '${{ needs.check-and-tag.outputs.version }}'
          with open('layoutlingua/_version.py', 'r') as f:
              content = f.read()
          content = re.sub(r'__version__\s*=\s*[\"\\\'][^\"\\\']+[\"\\\']', f'__version__ = \"{ver}\"', content)
          with open('layoutlingua/_version.py', 'w') as f:
              f.write(content)
          with open('package.json', 'r') as f:
              p = f.read()
          p = re.sub(r'\"version\":\s*\"[^\"]+\"', f'\"version\": \"{ver}\"', p)
          with open('package.json', 'w') as f:
              f.write(p)
          "
          if ! git diff --quiet; then
            git config --global user.name "ThanhNguyxnAgent[bot]"
            git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
            git add layoutlingua/_version.py package.json
            git commit -m "chore(release): bump version to ${{ needs.check-and-tag.outputs.version }} [skip ci]"
            git push origin main
          fi

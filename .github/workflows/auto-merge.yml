name: Auto Merge and Triage

# Automated CI/CD review, triage, and merge system for routine updates.
# Powered by ThanhNguyxnAgent with 3-OS CI matrix verification (Ubuntu, Windows, macOS).
# Routine dependency & Actions updates are auto-approved and auto-merged.
# Critical PRs labeled 'needs-review' or 'critical' are assigned to @ThanhNguyxnOrg/core.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge-safe-updates:
    name: Auto-Merge and Triage via ThanhNguyxnAgent
    runs-on: ubuntu-latest
    if: >
      !github.event.pull_request.draft &&
      (
        github.actor == 'dependabot[bot]' ||
        github.actor == 'ThanhNguyxnAgent[bot]' ||
        github.actor == 'ThanhNguyxnAgent' ||
        contains(github.event.pull_request.labels.*.name, 'automerge') ||
        contains(github.event.pull_request.labels.*.name, 'safe-update')
      )
    steps:
      - name: 🤖 Generate ThanhNguyxnAgent App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 🔍 Inspect Automated Dependency Metadata
        if: github.actor == 'dependabot[bot]' || github.actor == 'ThanhNguyxnAgent[bot]'
        id: dependabot-metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Check if this PR is marked as critical / requiring manual review
      - name: 🛡️ Check Review Requirement
        id: review-gate
        run: |
          IS_CRITICAL="false"
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          
          # Check if explicitly labeled with review tags
          if echo "$LABELS" | grep -Ei 'needs-review|critical|breaking-change|manual-review|do-not-merge'; then
            IS_CRITICAL="true"
          fi
          
          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      # If marked critical/needs-review: assign and tag core team via ThanhNguyxnAgent, disable auto-merge
      - name: 👥 Assign & Tag Core Team for Critical PR via ThanhNguyxnAgent
        if: steps.review-gate.outputs.is_critical == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Critical PR detected. Assigning core team for manual triage and review..."
          gh pr edit "$PR_URL" --add-label "needs-review,task" || true
          gh pr edit "$PR_URL" --add-assignee "RealThanhNguyxn,ThanhNguyxn07" || true
          gh pr edit "$PR_URL" --add-reviewer "RealThanhNguyxn,ThanhNguyxn07" || true
          gh pr comment "$PR_URL" --body "🔔 **Review Assignment:** @ThanhNguyxnOrg/core (@RealThanhNguyxn @ThanhNguyxn07) — This pull request has been flagged as critical or requiring manual review. Automated merging has been suspended pending core team approval." || true
          exit 0

      # Routine safe updates: approve and enable auto-merge via ThanhNguyxnAgent once 3-OS CI passes
      - name: ✅ Approve and Auto-Merge via ThanhNguyxnAgent
        if: steps.review-gate.outputs.is_critical != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Configuring Git actor for ThanhNguyxnAgent..."
          git config --global user.name "ThanhNguyxnAgent[bot]"
          git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          echo "Approving safe routine update: $PR_URL"
          gh pr review "$PR_URL" --approve --body "Auto-approved by ThanhNguyxnAgent: verified routine update with co-authorship." || true
          echo "Enabling auto-merge (squash) once 3-OS CI tests pass..."
          gh pr merge "$PR_URL" --auto --squash --delete-branch || true

name: Auto Merge Safe Updates

# Automatically merges ONLY routine, non-critical updates:
# 1. Dependabot minor & patch version updates (security & bug fixes)
# 2. PRs explicitly marked with 'automerge' or 'safe-update' labels
#
# Critical core logic, features, and major breaking changes will NEVER be auto-merged.
# Powered by ThanhNguyxnAgent with requirement that full 3-OS CI passes.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge-safe-updates:
    name: Auto-Merge and Triage
    runs-on: ubuntu-latest
    if: >
      !github.event.pull_request.draft &&
      (
        github.actor == 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'automerge') ||
        contains(github.event.pull_request.labels.*.name, 'safe-update')
      )
    steps:
      - name: 🤖 Generate GitHub App Token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 🔍 Inspect Dependabot Metadata (if Dependabot)
        if: github.actor == 'dependabot[bot]'
        id: dependabot-metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Check if this PR is marked or classified as critical / requiring manual review
      - name: 🛡️ Check Review Requirement
        id: review-gate
        run: |
          IS_CRITICAL="false"
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          
          # Check if explicitly labeled with review tags
          if echo "$LABELS" | grep -Ei 'needs-review|critical|breaking-change|manual-review|do-not-merge'; then
            IS_CRITICAL="true"
          fi
          
          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      # If marked critical/needs-review: assign and tag core team, disable auto-merge
      - name: 👥 Assign & Tag Core Team for Critical PR
        if: steps.review-gate.outputs.is_critical == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "⚠️ Critical PR detected. Tagging core team for triage & review..."
          gh pr edit "$PR_URL" --add-label "needs-review,task" || true
          gh pr edit "$PR_URL" --add-assignee "RealThanhNguyxn,ThanhNguyxn07" || true
          gh pr edit "$PR_URL" --add-reviewer "RealThanhNguyxn,ThanhNguyxn07" || true
          gh pr comment "$PR_URL" --body "🔔 **Giao việc / Cần Review:** @ThanhNguyxnOrg/core (@RealThanhNguyxn @ThanhNguyxn07) PR này được đánh dấu quan trọng/cần review thủ công. Tính năng auto-merge đã tạm dừng trên PR này để chờ core team duyệt." || true
          exit 0

      # Routine safe updates: approve and enable auto-merge once 3-OS CI passes
      - name: ✅ Approve and Enable Auto-Merge via ThanhNguyxnAgent
        if: steps.review-gate.outputs.is_critical != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Approving routine update: $PR_URL"
          gh pr review "$PR_URL" --approve --body "Auto-approved: safe routine update." || true
          echo "Enabling auto-merge (squash) once 3-OS CI tests pass..."
          gh pr merge "$PR_URL" --auto --squash --delete-branch || true

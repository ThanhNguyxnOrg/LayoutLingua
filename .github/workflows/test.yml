name: Test Suite

# Multi-platform Python CI using the organization workflow contract.
# Keep the three supported desktop OS in the matrix for platform-specific regressions.

on:
  push:
    branches:
      - main
    paths:
      - "layoutlingua/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
      - "*.py"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
    paths:
      - "layoutlingua/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-python.yml@dde345c28f4fc33bb49ac46e46b8adc174c24f7e
    with:
      job_name: Test (${{ matrix.os }})
      runner: ${{ matrix.os }}
      python_version: "3.12"
      cache: pip
      cache_dependency_path: requirements.txt
      install_command: >-
        python -m pip install --upgrade pip &&
        python -m pip install -r requirements.txt &&
        python -m pip install pytest pytest-mock
      test_command: pytest tests/ -v

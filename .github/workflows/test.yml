name: Test Suite

# Multi-platform CI test runner across all 3 supported desktop OS (Ubuntu, Windows, macOS).
# Runs unit and integration regression suites to protect engine invariants.

on:
  push:
    branches:
      - main
    paths:
      - "layoutlingua/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
      - "*.py"
  pull_request:
    branches:
      - main
    paths:
      - "layoutlingua/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

name: "Feature Request"
description: "Suggest a new idea, format support, or enhancement for LayoutLingua"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to LayoutLingua!
        > **Note on Language**: English is preferred for international collaboration and community visibility, but proposals in **Vietnamese (Tiếng Việt)** are also warmly welcomed!

  - type: textarea
    id: feature_description
    attributes:
      label: "Feature Description"
      description: "A clear and concise description of the feature or enhancement you would like to see"
      placeholder: "E.g., Automated bilingual side-by-side export mode for academic reviewing..."
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "Use Case & Motivation"
      description: "What problem does this feature solve? Who will benefit from it?"
      placeholder: "Researchers reviewing complex proofs need to compare original English formulas with translated annotations..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you have considered?"

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Add any other context, diagrams, or UI mockups here"

name: "Bug Report"
description: "Report layout corruption, broken formulas, table shifts, translation failures, or crashes"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to help improve LayoutLingua!
        > **Note on Language**: English is preferred for international collaboration and community visibility, but reports in **Vietnamese (Tiếng Việt)** are also warmly welcomed!

  - type: dropdown
    id: issue_category
    attributes:
      label: "Issue Category"
      description: "Select the category that best describes the problem"
      options:
        - "Formula Dropped / Broken (Math symbols lost, misplaced, or unrendered)"
        - "Layout Overlap / Text Overflow (Translated text bleeds into adjacent columns or figures)"
        - "Table Structure Breakage (Grid lines broken, borders disrupted, or cell alignment shifted)"
        - "Translation Engine Failure / Untranslated Segments"
        - "App GUI Crash / Freeze"
        - "Packaging / Installation / Auto-Update"
        - "Other"
    validations:
      required: true

  - type: input
    id: target_language
    attributes:
      label: "Target Language"
      description: "E.g., Vietnamese (vi), Simplified Chinese (zh), French (fr), German (de), Japanese (ja)..."
      placeholder: "vi"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS (Apple Silicon - M1/M2/M3/M4)"
        - "macOS (Intel - x86_64)"
        - "Linux (Ubuntu / Debian / Fedora / Arch)"
        - "Android"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: "LayoutLingua Version"
      description: "Found in app header or terminal (e.g., 1.0.0, commit hash, or source build)"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of what happened versus what you expected"
      placeholder: "E.g., On page 3 of the sample paper, Equation 4 was preserved in source language with a warning 'formula placeholders changed during translation'..."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can the maintainers reproduce this behavior?"
      placeholder: |
        1. Drag and drop PDF into LayoutLingua
        2. Set Target Language to '...'
        3. Click 'Translate All'
        4. Observe output PDF or error log
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Terminal Output / Error Log"
      description: "Paste relevant terminal output or crash logs here"
      render: shell

  - type: checkboxes
    id: fail_closed_acknowledged
    attributes:
      label: "Fail-Closed Safety Awareness"
      options:
        - label: "I understand that LayoutLingua intentionally prioritizes fail-closed preservation (keeping source segments intact) over producing corrupted translations that damage mathematical or tabular layout geometry."
          required: false

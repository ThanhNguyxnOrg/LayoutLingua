[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layoutlingua"
version = "2.0.0"
description = "High-fidelity academic & technical PDF translation engine with strict layout preservation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LayoutLingua Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pymupdf>=1.28.2",
    "platformdirs>=4.12.4",
    "ftfy>=6.3.1",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
vision = [
    "onnxruntime>=1.24.3",
    "opencv-python-headless>=5.0.0.93",
    "shapely>=2.1.2",
]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
]
all = [
    "onnxruntime>=1.24.3",
    "opencv-python-headless>=5.0.0.93",
    "shapely>=2.1.2",
    "rapidocr-onnxruntime>=1.4.4",
]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
layoutlingua-server = "layoutlingua.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["layoutlingua*"]

[tool.setuptools.package-data]
layoutlingua = [
    "resources/**/*",
]

[package]
name = "layoutlingua-desktop"
version = "2.0.0"
description = "LayoutLingua native desktop client powered by Tauri v2"
authors = ["ThanhNguyxnOrg"]
edition = "2021"

[lib]
name = "layoutlingua_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
